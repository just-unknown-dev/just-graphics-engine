name: just_graphics_engine_example
description: "just_graphics_engine on its own: glTF models, lights and a sky drawn by Scene3DView."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_graphics_engine:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
